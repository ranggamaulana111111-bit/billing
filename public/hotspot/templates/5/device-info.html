<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#040F3F" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon/index.svg" />
    <title>device-info</title>
</head>

<body
    class="bg-gradient-to-br from-[#243748] to-[#4b749f] h-screen flex justify-center items-center text-white m-0 p-0">

    <div class="relative w-full max-w-[500px] p-3 overflow-y-auto h-full">
        <!-- Card -->
        <div
            class="bg-white/10 backdrop-blur-md border border-white/20 rounded-xl p-6 shadow-[0_8px_32px_0_rgba(31,38,135,0.37)] animate-[fadeIn_0.8s_ease-out]">
            <h1
                class="mb-8 font-semibold text-3xl text-center bg-gradient-to-r from-white to-[#e2e2e2] bg-clip-text text-transparent">
                Device Info
            </h1>

            <div class="info-group">
                <span class="info-label">Product Name</span>
                <span class="info-value" id="productName">Loading...</span>
            </div>

            <div class="info-group">
                <span class="info-label">Window Size</span>
                <span class="info-value" id="win_size">Loading...</span>
            </div>

            <div class="info-group">
                <span class="info-label">User Agent</span>
                <span class="info-value !text-sm break-all" id="useragent">Loading...</span>
            </div>
        </div>

    </div>

    <script src="./init.js" type="text/javascript"></script>

</body>

</html>
