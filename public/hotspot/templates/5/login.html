<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta name="theme-color" content="#040F3F" />
	<link rel="icon" type="image/svg+xml" href="./assets/favicon/index.svg" />
	<style>
#promo-slider-container img{height:14vh;max-height:100px;width:100%;object-fit:cover}
#wave-solid{height:22vh!important;min-height:120px;max-height:200px}
#wave-svg-container{top:22vh!important;min-height:120px;max-height:200px;height:8vh!important}
@media(max-height:640px){#promo-slider-container img{height:10vh}#wave-solid{height:18vh!important;min-height:90px}#wave-svg-container{top:18vh!important;min-height:90px;height:6vh!important}}
@media(max-width:380px){#promo-slider-container img{height:10vh}#wave-solid{height:16vh!important;min-height:80px}#wave-svg-container{top:16vh!important;min-height:80px;height:5vh!important}#unified-card{font-size:90%}}
</style>
	<title>login</title>
</head>

<body id="bodyLogin" class="h-screen overflow-hidden flex flex-col font-sans antialiased offline-fallback">

	<div id="modalPopup"
		style="position:fixed; left:0; right:0; top:0; bottom:0; z-index:99999; display:none; align-items:center; justify-content:center; background-color: rgba(0,0,0,0.5);">
	</div>
	<div id="modalNetwork" style="display:none;"></div>

	<div class="relative z-10 w-full flex flex-col items-center flex-1 overflow-x-hidden">

		<div id="containerSection"
			class="relative page-container right-0 left-0 z-10 w-full flex flex-col flex-1">

			<!-- Background Waves Layer behind the card -->
			<div id="background-waves" class="absolute inset-0 z-0 pointer-events-none w-full">
				<div id="wave-solid" class="absolute inset-x-0 top-0"></div>
				<div id="wave-svg-container" class="absolute inset-x-0">
					<svg viewBox="0 0 1440 320" class="w-full h-full" preserveAspectRatio="none">
						<path id="wave-path" fill="#005ea6"
							d="M0,96L120,122.7C240,149,480,203,720,202.7C960,203,1200,149,1320,122.7L1440,96L1440,0L1320,0C1200,0,960,0,720,0C480,0,240,0,120,0L0,0Z">
						</path>
					</svg>
				</div>
			</div>

			<!-- UNIFIED TICKET CARD (Dropshadow & Hover Translations) -->
			<div id="unified-card"
				class="relative z-10 w-full select-none flex flex-col flex-1 filter drop-shadow-[0_15px_30px_rgba(0,0,0,0.18)]">

				<!-- 1. CARD HEADER (The page header) -->
				<div id="header"
					class="rounded-t-xl pt-6 px-6 pb-2 text-center flex flex-col items-center relative overflow-hidden">
					<!-- Populated by initHeader() with centered logo, title, clock, etc. -->
				</div>

				<!-- 2. CARD SEPARATOR (Hollow S-Curve Cuts & Dashed Line) -->
				<div class="relative flex items-center justify-between h-12 bg-transparent select-none">
					<!-- Left Side S-curve -->
					<svg class="w-4 h-12 text-white fill-current flex-shrink-0" viewBox="0 0 16 48"
						xmlns="http://www.w3.org/2000/svg">
						<path d="M 16 0 L 16 48 L 0 48 L 0 44 C 0 34, 8 34, 8 24 C 8 14, 0 14, 0 4 L 0 0 Z" />
					</svg>
					<!-- Fluid White Middle Spacer -->
					<div class="flex-grow h-full relative">
						<!-- Dashed Perforated Separator Line inside the middle white block -->
						<div id="card-perforated-line"
							class="absolute inset-x-0 top-1/2 -translate-y-1/2 border-t-2 border-dashed">
						</div>
					</div>
					<!-- Right Side S-curve -->
					<svg class="w-4 h-12 text-white fill-current flex-shrink-0" viewBox="0 0 16 48"
						xmlns="http://www.w3.org/2000/svg">
						<path d="M 0 0 L 0 48 L 16 48 L 16 44 C 16 34, 8 34, 8 24 C 8 14, 16 14, 16 4 L 16 0 Z" />
					</svg>
				</div>

				<!-- 3. CARD BODY (Encloses Login, Slider, Packages, FAQ) -->
				<main class="px-3 flex flex-col space-y-3 rounded-b-none text-slate-800 flex-1 min-h-0 overflow-y-auto">

					<!-- Login Card Container -->
					<div id="home" class="w-full flex flex-col">
						<div id="formLogin" class="w-full flex flex-col">

							<!-- Subtitle inside Card Body -->
							<p id="labelForm" style="font-weight: bold;"
								class="text-xl text-center text-slate-800 mb-3"></p>

							<div class="hidden">
								$(if chap-id)
								<form name="sendin" action="$(link-login-only)" method="post">
									<input type="hidden" name="username" />
									<input type="hidden" name="password" />
									<input type="hidden" name="dst" value="$(link-orig)" />
									<input type="hidden" name="popup" value="true" />
								</form>
								$(endif)
								<a href="$(link-login-only)?target=lv&amp;dst=$(link-orig-esc)"></a>
							</div>

							<form name="login" action="$(link-login-only)" method="post" $(if chap-id)
								onSubmit="return doLogin()" $(endif)>
								<input type="hidden" name="dst" value="$(link-orig)" />
								<input type="hidden" name="popup" value="true" />
								<div class="flex flex-col space-y-3 w-full">

									<div id="domUsername" class="w-full">
										<div class="input w-full flex justify-center items-center rounded-md border">
											<div class="w-full flex space-x-0 items-center">
												<div id="iconInputUser"
													class="z-20 px-3 text-center cursor-pointer text-slate-500">
												</div>
												<div class="inputSeparator border-l-2 border-dashed">
													&nbsp;</div>
												<div class="w-full flex space-x-3 justify-start items-center">
													<input type="text" name="username" placeholder="username"
														id="username" autocomplete="off" value="$(username)"
														class="z-20 px-2 py-3.5 text-base placeholder:text-slate-400 bg-transparent outline-none w-full text-slate-800">
													<div id="iconTypePasswordUser" onclick="changeTypePassUser(this)"
														class="z-20 px-3 text-center cursor-pointer text-slate-500">
													</div>
												</div>
											</div>
										</div>
									</div>

									<div id="domPassword" class="w-full hidden">
										<div class="input w-full flex justify-center items-center rounded-md border">
											<div class="w-full flex space-x-0 items-center">
												<div id="iconInputUserPassword"
													class="z-20 px-3 text-center cursor-pointer text-slate-500">
												</div>
												<div class="inputSeparator border-l-2 border-dashed">
													&nbsp;</div>
												<div class="w-full flex space-x-3 justify-start items-center">
													<input type="password" name="password" placeholder="password"
														id="password" autocomplete="off"
														class="z-20 px-2 py-3.5 text-base placeholder:text-slate-400 bg-transparent outline-none w-full text-slate-800">
													<div id="iconTypePassword" onclick="changeTypePass(this)"
														class="z-20 px-3 text-center cursor-pointer text-slate-500">
													</div>
												</div>
											</div>
										</div>
									</div>

									<div class="w-full xhidden">
										$(if error)
										<div class="alert w-full flex text-sm font-semibold" style="color: #ef4444;">
											$(error)
										</div>
										$(endif)
									</div>

									<div class="w-full pt-1">
										<input type="hidden" id="voucherActive" value="0">
										<div class="btnBg w-full flex-center">
											<button id="btnLogin" type="submit"
												class="w-full z-20 justify-center items-center px-6 py-3.5 text-base font-bold rounded-md tracking-wide shadow-md transform active:scale-[0.98] transition-all bg-[#005ea6] hover:bg-[#0089d7] text-white"></button>
										</div>
									</div>

								</div>
							</form>

							<div id="secLink"
								class="linkColor pt-3.5 mb-3 z-10 text-sm w-full flex space-x-4 flex-center font-medium">
								<div id="loginOpt" onclick="loginOpt()"
									class="w-max cursor-pointer space-x-1 justify-center items-center hidden">
								</div>
								<div id="btnTrial"
									class="w-max cursor-pointer space-x-1 justify-center items-center hidden">
								</div>
								<div id="btnLogInQrCode"
									class="w-max cursor-pointer space-x-1 justify-center items-center hidden">
								</div>
							</div>
						</div>
					</div>

					<!-- Dynamic components inside the same receipt body -->
					<div id="promo-slider-container" class="hidden"></div>
					<div id="packages-container" class="w-full hidden"></div>
					<div id="faq-container" class="w-full hidden"></div>
					<div id="lastSection" class="pb-3"></div>
				</main>

				<!-- 4. CARD BOTTOM JAGGED TEETH -->
				<div class="h-2 bg-transparent select-none pointer-events-none">
					<svg id="card-bottom-svg" class="w-full h-full" viewBox="0 0 360 8" preserveAspectRatio="none"
						fill="currentColor" xmlns="http://www.w3.org/2000/svg">
						<path d="M 0 0 L 360 0 L 360 4 
								 A 6 6 0 0 0 350 4 A 6 6 0 0 0 340 4 A 6 6 0 0 0 330 4 A 6 6 0 0 0 320 4 
								 A 6 6 0 0 0 310 4 A 6 6 0 0 0 300 4 A 6 6 0 0 0 290 4 A 6 6 0 0 0 280 4 
								 A 6 6 0 0 0 270 4 A 6 6 0 0 0 260 4 A 6 6 0 0 0 250 4 A 6 6 0 0 0 240 4 
								 A 6 6 0 0 0 230 4 A 6 6 0 0 0 220 4 A 6 6 0 0 0 210 4 A 6 6 0 0 0 200 4 
								 A 6 6 0 0 0 190 4 A 6 6 0 0 0 180 4 A 6 6 0 0 0 170 4 A 6 6 0 0 0 160 4 
								 A 6 6 0 0 0 150 4 A 6 6 0 0 0 140 4 A 6 6 0 0 0 130 4 A 6 6 0 0 0 120 4 
								 A 6 6 0 0 0 110 4 A 6 6 0 0 0 100 4 A 6 6 0 0 0 90 4 A 6 6 0 0 0 80 4 
								 A 6 6 0 0 0 70 4 A 6 6 0 0 0 60 4 A 6 6 0 0 0 50 4 A 6 6 0 0 0 40 4 
								 A 6 6 0 0 0 30 4 A 6 6 0 0 0 20 4 A 6 6 0 0 0 10 4 A 6 6 0 0 0 0 4 Z" />
					</svg>
				</div>
			</div>

			<!-- DOUBLE-TAB FOOTER NAVIGATION BAR (Home, Paket, FAQ, Chat) -->
			<div id="footer-nav-bar"
				class="fixed bottom-0 left-1/2 -translate-x-1/2 z-30 w-full max-w-md flex items-center justify-between py-4 px-2 select-none rounded-none">

				<!-- Tab Left: Home -->
				<button onclick="switchTab('home')" id="btn-tab-home"
					class="w-1/4 flex flex-col items-center justify-center text-center group transition-all duration-300 hover:scale-105 active:scale-95 outline-none cursor-pointer">
					<div class="opacity-100 transition-opacity duration-300" id="icon-tab-home">
						<svg class="h-6 w-6 mx-auto mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
							<polyline points="9 22 9 12 15 12 15 22" />
						</svg>
					</div>
					<span id="text-tab-home" class="text-[11px] font-bold tracking-wide mt-1">Home</span>
				</button>

				<!-- Center separator line -->
				<div id="div-tab-1" class="w-[1px] h-6 flex-shrink-0"></div>

				<!-- Tab Center: Paket -->
				<button onclick="switchTab('paket')" id="btn-tab-paket"
					class="w-1/4 flex flex-col items-center justify-center text-center group transition-all duration-300 hover:scale-105 active:scale-95 outline-none cursor-pointer">
					<div class="opacity-70 transition-opacity duration-300" id="icon-tab-paket">
						<svg class="h-6 w-6 mx-auto mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
							<line x1="9" y1="9" x2="15" y2="9" />
							<line x1="9" y1="13" x2="15" y2="13" />
							<line x1="9" y1="17" x2="15" y2="17" />
						</svg>
					</div>
					<span id="text-tab-paket" class="text-[11px] font-medium tracking-wide mt-1">Paket</span>
				</button>

				<!-- Center separator line -->
				<div id="div-tab-2" class="w-[1px] h-6 flex-shrink-0"></div>

				<!-- Tab Right: FAQ -->
				<button onclick="switchTab('faq')" id="btn-tab-faq"
					class="w-1/4 flex flex-col items-center justify-center text-center group transition-all duration-300 hover:scale-105 active:scale-95 outline-none cursor-pointer">
					<div class="opacity-70 transition-opacity duration-300" id="icon-tab-faq">
						<svg class="h-6 w-6 mx-auto mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
							<circle cx="12" cy="17" r="1" fill="currentColor" stroke="currentColor" stroke-width="1" />
							<circle cx="12" cy="12" r="10" />
						</svg>
					</div>
					<span id="text-tab-faq" class="text-[11px] font-medium tracking-wide mt-1">FAQ</span>
				</button>

				<!-- Center separator line -->
				<div id="div-tab-3" class="w-[1px] h-6 flex-shrink-0"></div>

				<!-- Tab Right: Chat -->
				<button onclick="triggerChat()" id="btn-tab-chat"
					class="w-1/4 flex flex-col items-center justify-center text-center group transition-all duration-300 hover:scale-105 active:scale-95 outline-none cursor-pointer">
					<div class="opacity-70 transition-opacity duration-300" id="icon-tab-chat">
						<svg class="h-6 w-6 mx-auto mb-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
							stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path
								d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
						</svg>
					</div>
					<span id="text-tab-chat" class="text-[11px] font-medium tracking-wide mt-1">Chat</span>
				</button>
			</div>
		</div>
		<div id="live-chat" style="display: none;"></div>
	</div>

	<a id="linkTrial" href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)"></a>
	<!-- <p id="isTrial" class="hidden">yes</p> -->
	<p id="isTrial" class="hidden">$(trial)</p>

	<script id="scriptMikrotik">
		function doLogin() {
			var username = document.getElementById("username");
			var password = document.getElementById("password");

			var domUsername = document.getElementById("domUsername");
			var domPassword = document.getElementById("domPassword");

			if (username.value.trim() === "") {
				var inputDiv = domUsername.querySelector(".input");
				if (inputDiv) {
					inputDiv.classList.add("border", "border-red-500"); // contoh pakai tailwind
				}
				username.focus();
				return false; // cegah submit
			}

			if (password.value.trim() === "") {
				var inputDiv = domPassword.querySelector(".input");
				if (inputDiv) {
					inputDiv.classList.add("border", "border-red-500"); // contoh pakai tailwind
				}
				password.focus();
				return false; // cegah submit
			}

			document.sendin.username.value = document.login.username.value;

			if (voucherActive.value == 0) {
				var user = document.sendin.username.value;
				username.value = user;
				password.value = user;
				document.sendin.password.value = hexMD5(
					"$(chap-id)" + user + "$(chap-challenge)"
				);
			} else {
				document.sendin.password.value = hexMD5(
					"$(chap-id)" + document.login.password.value + "$(chap-challenge)"
				);
			}

			document.sendin.submit();
			return false;
		}

	</script>
	<script src="./init.js" type="text/javascript"></script>
</body>

</html>
