# ── SERVER UTAMA: billing.alkonek.online ──
# Serve semua halaman aplikasi (login, portal, dashboard, dst.).
# Halaman depan "/" canonical ada di alkonek.online -> redirect 301.
server {

    listen 80 default_server;

    server_name billing.alkonek.online _;

    root /var/www/html/public;

    index index.php index.html;

    charset utf-8;

    # Halaman depan "/" canonical di alkonek.online -> redirect supaya
    # tidak ada duplikat konten welcome di dua domain (SEO).
    location = / {
        return 301 https://alkonek.online/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sitemap app (deteksi host oleh controller -> sitemap billing)
    location = /sitemap.xml {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {

        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass billing-app:9000;

        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_param PATH_INFO $fastcgi_path_info;

    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 100M;
}

# ── SITE LANDING: alkonek.online ──
# Hanya tampilkan halaman welcome ("/"); semua path lain redirect 301
# ke billing.alkonek.online agar tidak ada duplikat konten (SEO).
server {

    listen 80;

    server_name alkonek.online www.alkonek.online;

    root /var/www/html/public;

    index index.php index.html;

    charset utf-8;

    # Halaman depan (welcome) — serve seperti biasa
    location = / {
        try_files $uri /index.php?$query_string;
    }

    # Sitemap landing (controller deteksi host -> sitemap landing)
    location = /sitemap.xml {
        try_files $uri /index.php?$query_string;
    }

    # Aset statis (Vite build, gambar, storage, vendor, favicon) — serve normal
    # di landing, JANGAN redirect, agar halaman welcome tampil dengan style/logo.
    location ~ ^/(build|images|storage|vendor|css|js|fonts|hotspot)/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Semua path selain "/", sitemap & aset di atas -> redirect tarik ke billing
    location / {
        return 301 https://billing.alkonek.online$request_uri;
    }

    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_pass billing-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 100M;
}
